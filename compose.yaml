services:
  falkordb:
    image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    restart: unless-stopped
    environment:
      FALKORDB_ARGS: "TIMEOUT_MAX 5000 QUERY_MEM_CAPACITY 268435456"
      REDIS_ARGS: "--appendonly yes --aclfile /var/lib/falkordb/users.acl"
      REDISCLI_AUTH: ${FALKORDB_PASSWORD:?run make .env}
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
      - ./users.acl:/var/lib/falkordb/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 1s

  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    restart: unless-stopped
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:16686:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:13133/status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 1s

volumes:
  falkordb-data:
